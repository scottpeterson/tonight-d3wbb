name: Update site

on:
  schedule:
    - cron: "7 11,17,21 * * *"   # 6 a.m., noon, and 4 p.m. Eastern standard time: slates for today and tomorrow
    - cron: "37 7 * 11,12,1,2,3 *"   # 2:37 a.m. Eastern standard time, November to March: final scores and newcomer lines
    # Game nights, November to March: every 20 minutes from 6 p.m. to 1 a.m. Eastern standard time, finals and
    # box score snapshots only (fetch_data.py --finals reads just the schedule pages those games need).
    - cron: "*/20 23 * 11,12,1,2,3 *"
    - cron: "*/20 0-5 * 11,12,1,2,3 *"
    # Weekend afternoons, November to March: tournaments tip off from noon Eastern (2026-11-07).
    - cron: "*/20 17-22 * 11,12,1,2,3 0,6"
    # GitHub starts scheduled runs late on busy nights (3 h 44 min on 2026-11-06), so the Mac also starts the
    # game-night runs by dispatch: tools/dispatch_finals.sh, run by launchd every 20 minutes.
  workflow_dispatch:
    inputs:
      mode:
        description: "full, or finals for a game-night finals pass"
        required: false
        default: "full"

permissions:
  contents: write

# One writer at a time. The Mac never commits generated files; it only pulls.
concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch data and build the page
        run: |
          mode=""
          case "${{ github.event.schedule }}" in "*/20"*) mode="--finals" ;; esac
          if [ "${{ github.event.inputs.mode }}" = "finals" ]; then mode="--finals"; fi
          python fetch_data.py $mode || echo "fetch reported errors; building with what it got"
          python build_site.py
      - name: Commit and push when anything changed
        run: |
          git config user.name "tonight-d3wbb"
          git config user.email "tonight-d3wbb@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Update $(date -u '+%Y-%m-%d %H:%M UTC')"
            # Another writer can land first. This run's generated files are the newest, so they win a conflict.
            for try in 1 2 3; do
              git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            exit 1
          fi
